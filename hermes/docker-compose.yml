services:
  hermes:
    build: .
    ports:
      - "8642:8642"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HERMES_API_KEY=${HERMES_API_KEY}
      # Keep OpenAI key available for tools that call OpenAI directly (TTS, etc.)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - hermes-data:/root/.hermes
      - ./cli-config.yaml:/root/.hermes/cli-config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hermes-data:
    driver: local
